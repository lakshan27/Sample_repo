<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PackNext!!</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <header>
    <h1>Order Priority Planner</h1>
    <p>Build a deterministic ready to pack with mandatory search,filters,updates ...</p>
  </header>

  <main>
    <section class="card">
      <h2>Add Orders</h2>
      <form id="orderForm">
        <input id="name" placeholder="Order name" required>
        <input id="job_id" type="number" min="0" required>
        <input id="o_date" type="number" min="0" step="0.1"
               placeholder="order placed date" required>
        <input id="materials required" type="number" min="1"
               placeholder="Materials_req (quantity)" required>
        <input id="status" type="number" min="0" required>
        <button type="submit">Add Orders</button>
      </form>
      <p id="message"></p>
    </section>

    <section class="card">
      <h2>Inventory</h2>
      <button id="refreshBtn" type="button">Refresh</button>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>job_id</th>
              <th>o_date</th>
              <th>materials required</th>
              <th>Action</th>
              <th>status</th>
            </tr>
          </thead>
          <tbody id="products"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
