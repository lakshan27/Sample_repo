<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Stock AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Smart Stock AI</h1>
    <p>Inventory Dashboard & Demand Prediction</p>
  </header>

  <main>
    <section class="card">
      <h2>Add Product</h2>
      <form id="productForm">
        <input id="name" placeholder="Product name" required>
        <input id="stock" type="number" min="0"
               placeholder="Current stock" required>
        <input id="sales" type="number" min="0" step="0.1"
               placeholder="Daily sales" required>
        <input id="lead" type="number" min="1"
               placeholder="Lead time (days)" required>
        <button type="submit">Add Product</button>
      </form>
      <p id="message"></p>
    </section>

    <section class="card">
      <h2>Inventory</h2>
      <button id="refreshBtn" type="button">Refresh</button>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Stock</th>
              <th>Daily Sales</th>
              <th>Lead Time</th>
              <th>AI Prediction</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="products"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
